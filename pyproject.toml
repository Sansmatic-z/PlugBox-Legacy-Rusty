[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "plugbox"
version = "0.1.0"
description = "PlugBox — The Legacy FFI Prototype (V1)"
authors = [{name = "Raj Mitra"}]
requires-python = ">=3.8"
license = {text = "Apache-2.0"}

[tool.maturin]
features = ["pyo3/extension-module"]
